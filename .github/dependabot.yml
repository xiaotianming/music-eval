version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
# Python/model-stack updates require manual lock regeneration and CPU smoke tests.
# See docs/dependencies.md; upstream SongEval and FAD constraints are isolated.
